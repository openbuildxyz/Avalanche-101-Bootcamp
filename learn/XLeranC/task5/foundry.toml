[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

# Lint 配置：src/ 与 script/ 保持零告警；以下 5 条仅针对测试文件的误报/风格提示
# (Foundry 1.8 lint)，在测试代码中按惯例可忽略，故排除以保持构建输出干净。
[lint]
exclude_lints = [
    "literal-instead-of-constant",   # 测试中大量重复使用 `1000 ether` 等字面量
    "reentrancy-events",             # vm.expectEmit 必须先 emit 再调用，属预期模式
    "erc20-unchecked-transfer",      # 测试中忽略 transfer 返回值属预期
    "arbitrary-send-erc20",          # 测试需要以任意 from 调用 transferFrom
    "unused-return",                 # 测试中忽略 approve 返回值属预期
    "calls-loop",                    # 测试故意在循环中反复 pause/unpause 以验证循环稳定性
]

# Avalanche networks
[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
avalanche = "https://api.avax.network/ext/bc/C/rpc"

[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113, url = "https://api.snowtrace.io/api" }
